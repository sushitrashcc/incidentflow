---
- name: Connectivity check
  hosts: web
  gather_facts: true
  tasks:
    - name: Ping
      ansible.builtin.ping:
    - name: Report server details
      ansible.builtin.debug:
        msg: "{{ ansible_facts['hostname'] }} | {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} | {{ ansible_facts['processor_vcpus'] }} vCPU | {{ (ansible_facts['memtotal_mb'] / 1024) | round(1) }} GB RAM | kernel {{ ansible_facts['kernel'] }}"
