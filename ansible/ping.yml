---
- name: Connectivity check
  hosts: web
  gather_facts: true
  tasks:
    - name: Ping
      ansible.builtin.ping:
    - name: Report server details
      ansible.builtin.debug:
        msg: "{{ ansible_hostname }} | {{ ansible_distribution }} {{ ansible_distribution_version }} | {{ ansible_processor_vcpus }} vCPU | {{ (ansible_memtotal_mb / 1024) | round(1) }} GB RAM | kernel {{ ansible_kernel }}"
