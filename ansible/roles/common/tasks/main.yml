---
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, git, htop, jq, unattended-upgrades]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone to Asia/Kolkata
  ansible.builtin.command: timedatectl set-timezone Asia/Kolkata
  changed_when: false

- name: Check for swap file
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile

- name: Create swap file
  ansible.builtin.command: "fallocate -l {{ swap_size_mb }}M /swapfile"
  when: not swapfile.stat.exists

- name: Prepare and enable swap
  ansible.builtin.shell: chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  when: not swapfile.stat.exists

- name: Persist swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
